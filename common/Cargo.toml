[package]
name = "sloptube-common"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "What SlopTube and SlopTube Music share"
license = "GPL-3.0-or-later"

[features]
# Google's sign-in page in the sign-in dialog (WebKitGTK 6.0; Linux only)
webkit = ["dep:webkit"]

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_18"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_7"] }
gst = { package = "gstreamer", version = "0.25" }
tokio = { version = "1", features = ["rt-multi-thread", "time", "process", "io-util", "sync"] }
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "http2", "json", "gzip", "brotli", "deflate", "charset"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
libc = "0.2"
url = "2"
# Most thumbnails are WebP, which gdk-pixbuf can't always decode (e.g. on macOS)
image-webp = "0.2.4"

# The Google session: storage, request signing, browser cookie import
oo7 = { version = "0.6", default-features = false, features = ["tokio", "openssl_crypto"] }
sha1 = "0.10"
hex = "0.4"
rusqlite = "0.37"
aes = "0.8"
cbc = "0.1"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }

[target.'cfg(target_os = "linux")'.dependencies]
webkit = { package = "webkit6", version = "0.6", optional = true, features = ["v2_46"] }
