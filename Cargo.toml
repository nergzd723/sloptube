[package]
name = "sloptube"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "A lightweight native YouTube client for Linux (GTK4/libadwaita + GStreamer)"
license = "GPL-3.0-or-later"

[workspace]
members = ["common", "music"]

[features]
default = ["webkit", "static-sink"]
# Google's sign-in page in the sign-in dialog (WebKitGTK 6.0; Linux only, ignored elsewhere)
webkit = ["common/webkit"]
# Link gtk4paintablesink into the binary instead of relying on the system plugin
static-sink = ["dep:gst-plugin-gtk4"]

[dependencies]
# What SlopTube and SlopTube Music share
common = { package = "sloptube-common", path = "common" }
# SlopTube Music, which runs in the same process (`sloptube --music`)
sloptube-music = { path = "music" }

gtk = { package = "gtk4", version = "0.11", features = ["v4_20"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_7"] }
gst = { package = "gstreamer", version = "0.25" }
gst-plugin-gtk4 = { version = "0.15", optional = true, features = ["gtk_v4_20"] }

tokio = { version = "1", features = ["rt-multi-thread", "process", "io-util", "sync", "time", "macros", "fs", "signal"] }
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "http2", "json", "gzip", "brotli", "deflate", "charset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
url = "2"
rand = "0.9"
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }

# The sink's Wayland, X11 and DMABuf paths need libraries that only Linux has,
# so other platforms (macOS) build without them (as without WebKitGTK).
[target.'cfg(target_os = "linux")'.dependencies]
gst-plugin-gtk4 = { version = "0.15", optional = true, features = ["wayland", "x11egl", "dmabuf", "gtk_v4_20"] }

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

[profile.dev]
# Keep debug builds usable for video playback & JSON parsing
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[build-dependencies]
glib-build-tools = "0.22"
