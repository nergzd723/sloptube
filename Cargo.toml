[package]
name = "sloptube"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A lightweight native YouTube client for Linux (GTK4/libadwaita + GStreamer)"
license = "GPL-3.0-or-later"

[features]
default = ["webkit", "static-sink"]
# In-app Google sign-in window (WebKitGTK 6.0)
webkit = ["dep:webkit"]
# Link gtk4paintablesink into the binary instead of relying on the system plugin
static-sink = ["dep:gst-plugin-gtk4"]

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_20"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_7"] }
gst = { package = "gstreamer", version = "0.25" }
gst-plugin-gtk4 = { version = "0.15", optional = true, features = ["wayland", "x11egl", "dmabuf", "gtk_v4_20"] }
webkit = { package = "webkit6", version = "0.6", optional = true, features = ["v2_46"] }

tokio = { version = "1", features = ["rt-multi-thread", "process", "io-util", "sync", "time", "macros", "fs"] }
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "http2", "json", "gzip", "brotli", "deflate", "charset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
url = "2"
rand = "0.9"
sha1 = "0.10"
hex = "0.4"
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }

mpris-server = "0.10"
oo7 = { version = "0.6", default-features = false, features = ["tokio", "openssl_crypto"] }

# Importing a session from Chromium-based browsers
rusqlite = "0.37"
aes = "0.8"
cbc = "0.1"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

[profile.dev]
# Keep debug builds usable for video playback & JSON parsing
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[build-dependencies]
glib-build-tools = "0.22"
